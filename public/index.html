<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Пиписьки</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍆</text></svg>" />
</head>
<body>
  <!-- Экран входа -->
  <div id="auth-screen" class="screen">
    <div class="auth-card">
      <div class="logo">🍆 Пиписьки</div>
      <p class="subtitle">Лёгкий Discord с звонками</p>

      <div class="tabs">
        <button class="tab active" data-tab="login">Вход</button>
        <button class="tab" data-tab="register">Регистрация</button>
      </div>

      <form id="login-form" class="auth-form">
        <input type="text" id="login-username" placeholder="Логин" required minlength="3" />
        <input type="password" id="login-password" placeholder="Пароль" required minlength="4" />
        <button type="submit">Войти</button>
        <p id="login-error" class="error"></p>
      </form>

      <form id="register-form" class="auth-form hidden">
        <input type="text" id="reg-username" placeholder="Логин (от 3 символов)" required minlength="3" />
        <input type="password" id="reg-password" placeholder="Пароль (от 4 символов)" required minlength="4" />
        <button type="submit">Создать аккаунт</button>
        <p id="reg-error" class="error"></p>
      </form>
    </div>
  </div>

  <!-- Основной интерфейс -->
  <div id="app-screen" class="screen hidden">
    <!-- Боковая панель -->
    <aside class="sidebar">
      <div class="server-header">
        <span class="server-name">🍆 Пиписьки</span>
      </div>

      <div class="user-panel">
        <div class="my-avatar-wrap">
          <img id="my-avatar" src="" alt="" class="avatar" />
          <label for="avatar-input" class="avatar-edit" title="Сменить аватар">✏️</label>
          <input type="file" id="avatar-input" accept="image/*" hidden />
        </div>
        <div class="my-info">
          <div id="my-username" class="username"></div>
          <div class="status online">онлайн</div>
        </div>
        <button id="logout-btn" class="icon-btn" title="Выйти">🚪</button>
      </div>

      <div class="section-title">Онлайн</div>
      <div id="users-list" class="users-list"></div>
    </aside>

    <!-- Основная область -->
    <main class="main">
      <div id="empty-state" class="empty-state">
        <div class="empty-icon">🍆</div>
        <h2>Добро пожаловать в Пиписьки</h2>
        <p>Выбери кого-нибудь слева и позвони</p>
      </div>

      <!-- Звонок -->
      <div id="call-view" class="call-view hidden">
        <div class="call-header">
          <img id="call-avatar" class="avatar large" src="" />
          <div>
            <div id="call-username" class="call-name"></div>
            <div id="call-status" class="call-status">Соединение...</div>
          </div>
        </div>

        <div class="video-area">
          <video id="remote-video" autoplay playsinline></video>
          <video id="local-video" autoplay playsinline muted></video>
        </div>

        <div class="call-controls">
          <button id="toggle-mic" class="ctrl-btn" title="Микрофон">🎤</button>
          <button id="toggle-cam" class="ctrl-btn" title="Камера">📷</button>
          <button id="toggle-screen" class="ctrl-btn" title="Демонстрация экрана">🖥️</button>
          <button id="hangup-btn" class="ctrl-btn hangup" title="Завершить">📵</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Входящий звонок -->
  <div id="incoming-modal" class="modal hidden">
    <div class="modal-content">
      <img id="incoming-avatar" class="avatar large" src="" />
      <h3 id="incoming-name"></h3>
      <p>Входящий звонок...</p>
      <div class="modal-btns">
        <button id="accept-call" class="accept">Принять</button>
        <button id="reject-call" class="reject">Отклонить</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
