<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ошибка сервера</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Press Start 2P', monospace;
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
    }

    /* Настоящая текстура земли Minecraft */
    .dirt-bg {
      position: fixed;
      inset: 0;
      background-image: url('dirt.png');
      background-repeat: repeat;
      background-size: 96px 96px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      z-index: 0;
    }

    /* Лёгкое затемнение для читаемости текста */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    /* Заголовок */
    .error-title {
      color: #ff5555;
      font-size: clamp(16px, 4.5vw, 28px);
      text-shadow:
        4px 4px 0 #2a0000,
        2px 2px 0 #000;
      margin-bottom: 28px;
      letter-spacing: 1px;
      line-height: 1.4;
    }

    /* Основной блок сообщения */
    .error-box {
      background: rgba(12, 8, 5, 0.82);
      border: 4px solid #3d2b1f;
      border-top-color: #7a5c45;
      border-left-color: #7a5c45;
      border-bottom-color: #1a100a;
      border-right-color: #1a100a;
      padding: 26px 30px;
      max-width: 480px;
      width: 100%;
      box-shadow:
        0 0 0 3px #000,
        8px 8px 0 rgba(0, 0, 0, 0.45);
    }

    .error-text {
      color: #e8dcc8;
      font-size: clamp(10px, 2.6vw, 13px);
      line-height: 1.85;
      text-shadow: 2px 2px 0 #000;
    }

    .error-text p {
      margin-bottom: 12px;
    }

    .error-text .highlight {
      color: #ffb020;
    }

    .error-text .code {
      margin-top: 18px;
      color: #8a7a60;
      font-size: 0.85em;
    }

    /* Загрузка */
    .loader-section {
      margin-top: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .loader-label {
      color: #c8b890;
      font-size: clamp(9px, 2.1vw, 11px);
      text-shadow: 2px 2px 0 #000;
      letter-spacing: 1px;
    }

    /* Квадрат с 9 точками */
    .dot-loader {
      width: 68px;
      height: 68px;
      background: rgba(10, 6, 4, 0.9);
      border: 3px solid #3d2b1f;
      border-top-color: #6b4e38;
      border-left-color: #6b4e38;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 5px;
      padding: 9px;
      box-shadow: 0 0 0 2px #000, 4px 4px 0 rgba(0,0,0,0.4);
    }

    .dot {
      width: 100%;
      height: 100%;
      background: #2a1c12;
      box-shadow: inset 0 0 0 1px #150e08;
      transition: background 0.07s, box-shadow 0.07s;
    }

    .dot.active {
      background: #55ff55;
      box-shadow:
        0 0 8px #55ff55,
        0 0 16px rgba(85, 255, 85, 0.55),
        inset 0 0 3px #c0ffc0;
    }

    .dot.trail {
      background: #2d8a2d;
      box-shadow: 0 0 5px rgba(45, 138, 45, 0.45);
    }

    /* Кнопка звука */
    .sound-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(12, 8, 5, 0.9);
      border: 3px solid #3d2b1f;
      border-top-color: #6b4e38;
      border-left-color: #6b4e38;
      color: #c8b890;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      padding: 9px 12px;
      cursor: pointer;
      z-index: 30;
      text-shadow: 1px 1px 0 #000;
      box-shadow: 0 0 0 2px #000;
    }

    .sound-btn:hover {
      color: #ffb020;
    }

    .sound-btn.playing {
      color: #55ff55;
      border-color: #2a6b2a;
      border-top-color: #3d9a3d;
      border-left-color: #3d9a3d;
    }

    @media (max-width: 480px) {
      .error-box {
        padding: 20px 16px;
      }
      .loader-section {
        margin-top: 32px;
      }
      .dot-loader {
        width: 58px;
        height: 58px;
        gap: 4px;
        padding: 7px;
      }
      .sound-btn {
        font-size: 8px;
        padding: 8px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="dirt-bg"></div>
  <div class="overlay"></div>

  <button class="sound-btn" id="soundBtn">♪ ЗВУК</button>

  <div class="container">
    <h1 class="error-title">ОШИБКА СЕРВЕРА</h1>

    <div class="error-box">
      <div class="error-text">
        <p>Сервер временно недоступен.</p>
        <p>Сейчас происходят<br><span class="highlight">технические работы</span>.</p>
        <p>Попробуйте зайти немного позже.</p>
        <p class="code">Error: Connection lost</p>
      </div>
    </div>

    <div class="loader-section">
      <div class="loader-label">ПОДКЛЮЧЕНИЕ...</div>
      <div class="dot-loader" id="dotLoader">
        <div class="dot" data-idx="0"></div>
        <div class="dot" data-idx="1"></div>
        <div class="dot" data-idx="2"></div>
        <div class="dot" data-idx="3"></div>
        <div class="dot" data-idx="4"></div>
        <div class="dot" data-idx="5"></div>
        <div class="dot" data-idx="6"></div>
        <div class="dot" data-idx="7"></div>
        <div class="dot" data-idx="8"></div>
      </div>
    </div>
  </div>

  <audio id="bgAudio" loop preload="auto">
    <source src="wilted.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Путь обхода точек (по часовой, старт с правого верхнего)
    // 0 1 2
    // 3 4 5
    // 6 7 8
    const path = [2, 5, 8, 7, 6, 3, 0, 1];
    const dots = document.querySelectorAll('.dot');
    let step = 0;
    const TRAIL = 3;

    function updateDots() {
      dots.forEach(d => d.classList.remove('active', 'trail'));
      const active = path[step % path.length];
      dots[active].classList.add('active');
      for (let i = 1; i <= TRAIL; i++) {
        const t = path[(step - i + path.length * 20) % path.length];
        if (t !== active) dots[t].classList.add('trail');
      }
      step++;
    }
    setInterval(updateDots, 170);
    updateDots();

    // Звук
    const audio = document.getElementById('bgAudio');
    const btn = document.getElementById('soundBtn');
    let playing = false;

    function playSound() {
      audio.volume = 0.6;
      audio.play().then(() => {
        playing = true;
        btn.classList.add('playing');
        btn.textContent = '♪ ЗВУК ВКЛ';
      }).catch(() => {
        playing = false;
        btn.classList.remove('playing');
        btn.textContent = '♪ ВКЛЮЧИТЬ';
      });
    }

    // Автозапуск при загрузке
    window.addEventListener('load', playSound);

    // Кнопка
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (playing) {
        audio.pause();
        playing = false;
        btn.classList.remove('playing');
        btn.textContent = '♪ ВКЛЮЧИТЬ';
      } else {
        playSound();
      }
    });

    // Если autoplay заблокирован — запускаем по любому клику
    document.body.addEventListener('click', function unlock() {
      if (!playing) playSound();
      document.body.removeEventListener('click', unlock);
    }, { once: true });
  </script>
</body>
</html>
